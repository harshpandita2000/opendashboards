name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opendashboards
          POSTGRES_PASSWORD: opendashboards
          POSTGRES_DB: opendashboards_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U opendashboards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://opendashboards:opendashboards@localhost:54329/opendashboards_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate dashboard spec
        run: pnpm dashboard:spec

      - name: Lint
        run: pnpm lint

      # Route types (LayoutProps, PageProps, …) come from Next.js, not the repo.
      - name: Typecheck
        run: pnpm exec next typegen && pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit (production deps, high and above)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
